# Configuración de MPD para rmpc
# https://mpd.readthedocs.io/en/stable/User_Manual.html

# --- Biblioteca ---
# Ahora apunta a ~/Música. Cuando enchufes el disco USB en este PC,
# cámbialo por /mnt/musica (y guárdalo en tu dotfiles)
music_directory      "~/Music"
playlist_directory   "~/.local/share/mpd/playlists"
db_file              "~/.local/share/mpd/database"
state_file           "~/.local/share/mpd/state"
sticker_file         "~/.local/share/mpd/sticker.sql"

# --- Red ---
# Solo localhost: no se expone a la red. Para servir música al móvil
# usa Navidrome (proyecto ~/projects/music_streaming), no MPD.
bind_to_address      "127.0.0.1"
port                 "6600"

# --- Salida de audio ---
# PipeWire expone el servidor "pulse" por compatibilidad: es lo más fiable.
audio_output {
    type    "pulse"
    name    "Salida local (PipeWire)"
    mixer_type "software"
}

# --- Varios ---
auto_update          "yes"   # detecta canciones nuevas automáticamente
filesystem_charset   "UTF-8"
