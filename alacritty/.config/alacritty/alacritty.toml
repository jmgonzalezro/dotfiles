
[bell]
animation = "EaseOutExpo"
duration = 0

# Los colores vienen del tema activo (qtile/themes/*.toml). No los pongas aquí:
# este archivo se carga DESPUÉS de sus imports y los sobrescribiría.
# Generado en ~/.local/state/qtile/app/alacritty.toml

[cursor]
blink_interval = 500
blink_timeout = 5
unfocused_hollow = false

[cursor.style]
blinking = "on"
shape = "Block"

[env]
TERM = "alacritty"
WINIT_X11_SCALE_FACTOR = "1.0"

[font]
size = 13.0

[font.bold]
family = "Fira Code"
style = "Bold"

[font.bold_italic]
family = "Hack"
style = "Bold Italic"

[font.italic]
family = "Hack"
style = "Italic"

[font.normal]
family = "Fira Code"
style = "Regular"

[mouse]
hide_when_typing = true

[scrolling]
history = 10000
multiplier = 10

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[window]
decorations = "none"
# opacity viene del tema (opaca en 'washed', 0.92 en 'monochrome')

[window.dimensions]
columns = 86
lines = 22

[general]
import = ["~/.local/state/qtile/app/alacritty.toml"]
live_config_reload = true
